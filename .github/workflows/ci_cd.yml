name: Farm Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HF_SPACE: shank-j/farm-agent

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ app/ --ignore E501,E402

  deploy:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: pip install huggingface_hub
      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          from huggingface_hub import HfApi
          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          api.upload_folder(
              folder_path=".",
              repo_id="${{ env.HF_SPACE }}",
              repo_type="space",
              ignore_patterns=[
                  ".git*", "__pycache__", "*.pyc",
                  "mlflow/*.db", "outputs/", ".env",
                  "tests/", "data/faiss_index/",
              ],
          )
          print("Deployed to HF Spaces: ${{ env.HF_SPACE }}")
          EOF
