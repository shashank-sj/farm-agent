name: Farm Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HF_SPACE: shank-j/farm_agent

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true                # best.pt is stored in Git LFS
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only torch + torchvision from the same index: ~200 MB instead of ~2.5 GB of CUDA libraries.
      # Installing torchvision from PyPI instead (as an ultralytics dependency) pairs a CUDA build
      # with CPU torch and YOLO loading fails with "operator torchvision::nms does not exist".
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ scripts/ finetune/ tests/ app.py --ignore E501,E402

  deploy:
    name: Build RAG index & deploy to HuggingFace Spaces
    runs-on: ubuntu-24.04
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-ingest.txt huggingface_hub
      # The index is a build artifact: rebuilt from source documents + the Q&A
      # dataset on every deploy instead of being committed to git.
      - run: python -m scripts.build_rag_index --qa-dataset
      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              ignore_patterns=[
                  ".git*", "**/__pycache__/**", "*.pyc", ".env", "mlruns/**",
                  "tests/**", "notebooks/**", "finetune/**", "unused/**", "results/**",
                  "data/finetune/**", "outputs/finetune/**", "*.png", "New folder/**",
              ],
          )
          print("Deployed to HF Spaces:", os.environ["HF_SPACE"])
          EOF
